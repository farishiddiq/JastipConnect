<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1424" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="JastipConnect: titip barang, temukan perjalanan, terhubung dengan diaspora Indonesia di Arab Saudi." />
    <meta property="og:title" content="JastipConnect" />
    <meta property="og:description" content="Titip barang, temukan perjalanan, terhubung dengan diaspora." />
    <meta property="og:image" content="/images/hero.webp" />
    <link rel="preload" as="image" href="/images/hero.webp" fetchpriority="high" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('jc:v1:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
    <title>JastipConnect: Jastip Diaspora Saudi ↔ Indonesia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
